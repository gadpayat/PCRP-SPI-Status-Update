<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SPI Status Update</title>

<style>

/* ======================================
   GLOBAL SETTINGS
====================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',Arial,sans-serif;
}

html,body{
    width:100%;
    min-height:100%;
    background:transparent;
    overflow-x:hidden;
}

/* ======================================
   CONTAINER
   4 COLUMNS × 3 ROWS
   ROW 1 = 4 BUTTONS
   ROW 2 = 4 BUTTONS
   ROW 3 = 2 CENTERED BUTTONS
====================================== */

.container{
    width:100%;
    display:grid;

    grid-template-columns:repeat(4, 220px);
    grid-template-rows:repeat(3, 250px);

    justify-content:center;
    align-items:center;

    column-gap:35px;
    row-gap:35px;

    padding:40px;
}

/* Center the final two buttons symmetrically */
.container .spi-button:nth-child(9){
    grid-column:2;
}

.container .spi-button:nth-child(10){
    grid-column:3;
}

/* ======================================
   GLASS BUTTON
====================================== */

.spi-button{

    width:220px;
    height:250px;

    text-decoration:none;
    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    border-radius:28px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,0),
        rgba(255,255,255,0)
    );

    backdrop-filter:blur(.5px);
    -webkit-backdrop-filter:blur(.5px);

    border:1px solid rgba(255,255,255,.05);

    box-shadow:

    inset 0 2px 8px rgba(255,255,255,.55),

    inset 0 -5px 10px rgba(0,0,0,.15),

    0 15px 35px rgba(0,0,0,.30);

    transition:.35s;

    position:relative;

    overflow:hidden;
}

/* ======================================
   GLOSSY SHINE
====================================== */

.spi-button::before{

    content:'';

    position:absolute;

    top:-120%;
    left:-45%;

    width:60%;
    height:300%;

    background:rgba(255,255,255,.35);

    transform:rotate(25deg);

    transition:.7s;
}

.spi-button:hover::before{
    left:130%;
}

.spi-button:hover{

    transform:
    translateY(-10px)
    scale(1.04);

    box-shadow:

    0 25px 45px rgba(0,0,0,.45),

    0 0 35px rgba(255,255,255,.45),

    inset 0 2px 12px rgba(255,255,255,.6);
}

/* ======================================
   LOGO
====================================== */

.logo{

    width:120px;
    height:120px;

    border-radius:50%;

    background:white;

    padding:8px;

    object-fit:contain;

    box-shadow:
    0 8px 20px rgba(0,0,0,.25);

    margin-bottom:22px;
}

/* ======================================
   TITLE
====================================== */

.title{

    font-size:22px;

    font-weight:700;

    text-align:center;

    line-height:1.35;

    padding:0 18px;

    color:white;

    text-shadow:
    0 2px 5px rgba(0,0,0,.45);
}

/* ======================================
   RESPONSIVE
====================================== */

@media(max-width:1050px){

    .container{
        grid-template-columns:repeat(2, 220px);
        grid-template-rows:auto;
    }

    /* Reset desktop positioning on smaller screens */
    .container .spi-button:nth-child(9),
    .container .spi-button:nth-child(10){
        grid-column:auto;
    }

}

@media(max-width:550px){

    .container{
        grid-template-columns:1fr;
        grid-template-rows:auto;

        padding:25px 15px;
    }

    .spi-button{
        width:90%;
        max-width:320px;
        justify-self:center;
    }

    .container .spi-button:nth-child(9),
    .container .spi-button:nth-child(10){
        grid-column:auto;
    }

}

</style>
</head>
